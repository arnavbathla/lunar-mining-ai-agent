version: "3.9"

services:
  api:
    build:
      context: ./apps/api
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - DATABASE_URL=sqlite:////data/lunar_mineops.db
      - CORS_ORIGINS=http://localhost:3000
      - SOURCE_REFRESH_MODE=${SOURCE_REFRESH_MODE:-live}
    ports:
      - "8000:8000"
    volumes:
      - api_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api_data:
